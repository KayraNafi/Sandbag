# Nothing here publishes a port. `web` is the one way in, through your tunnel's network.
# Each service reaches only what it needs: web talks to api, api and push talk to db,
# and only `push`, which is optional, can reach the internet or read the Firebase key.
name: sandbag

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_DB: sandbag
      POSTGRES_USER: sandbag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
      PUSH_DB_PASSWORD: ${PUSH_DB_PASSWORD:?set in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db-init.sh:/docker-entrypoint-initdb.d/roles.sh:ro
    networks: [data]
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sandbag"]
      interval: 10s
      retries: 5

  api:
    build: ..
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      # The admin account stays with the database. The app gets one that can't touch the server.
      DATABASE_URL: postgres://sandbag_app:${APP_DB_PASSWORD}@db:5432/sandbag
      BOOTSTRAP_INVITE_CODE: ${BOOTSTRAP_INVITE_CODE:?set in .env}
      TRUSTED_PROXIES: "1"
      PORT: "8080"
    networks: [app, data]
    mem_limit: 384m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  push:
    build: ..
    profiles: [push]
    command: ["node", "dist/pushWorker.js"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }
    environment:
      DATABASE_URL: postgres://sandbag_push:${PUSH_DB_PASSWORD}@db:5432/sandbag
      FIREBASE_SERVICE_ACCOUNT_FILE: /run/firebase/admin.json
    volumes:
      - ./.firebase/admin.json:/run/firebase/admin.json:ro
    networks: [data, egress]
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  web:
    image: caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    depends_on: [api]
    user: "1000:1000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
    tmpfs:
      - /data:uid=1000,gid=1000
      - /config:uid=1000,gid=1000
    networks: [app, edge]
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    # Caddy's binary carries this capability, and won't start without it even as non-root.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  app:
    internal: true
  data:
    internal: true
  egress: {}
  edge:
    external: true
    name: ${EDGE_NETWORK:?the docker network your tunnel runs on}
