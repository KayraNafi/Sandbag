# The database and API sit on a network with no way out and no published ports.
# Only `web` joins your tunnel's network, and it's the one way in.
# `push` is optional, and the only service that can reach the internet or read the Firebase key.
name: sandbag

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sandbag
      POSTGRES_USER: sandbag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sandbag"]
      interval: 10s
      retries: 5

  api:
    build: ..
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://sandbag:${POSTGRES_PASSWORD}@db:5432/sandbag
      BOOTSTRAP_INVITE_CODE: ${BOOTSTRAP_INVITE_CODE:?set in .env}
      TRUSTED_PROXIES: "1"
      PORT: "8080"
    networks: [internal]
    mem_limit: 384m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  push:
    build: ..
    profiles: [push]
    command: ["node", "dist/pushWorker.js"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }
    environment:
      DATABASE_URL: postgres://sandbag:${POSTGRES_PASSWORD}@db:5432/sandbag
      FIREBASE_SERVICE_ACCOUNT_FILE: /run/firebase/admin.json
    volumes:
      - ./.firebase/admin.json:/run/firebase/admin.json:ro
    networks: [internal, egress]
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
    tmpfs: [/data, /config]
    networks: [internal, edge]
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  internal:
    internal: true
  egress: {}
  edge:
    external: true
    name: ${EDGE_NETWORK:?the docker network your tunnel runs on}
